# Independent launcher configuration. Brain/Cell config.toml does not read this.
enabled = true
writing_enabled = true

[lean]
lean_project = ""
lake_bin = "lake"
max_compile_attempts = 3
compile_timeout_seconds = 120
timeout_seconds = 1800

[writing]
timeout_seconds = 1800

# Empty values inherit the native CLI's existing login/model settings.
[model]
codex_bin = ""
auth_home = ""
model = ""
reasoning_effort = ""
search_enabled = true

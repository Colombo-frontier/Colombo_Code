# Resolve relative paths against this file. Complete acceptance on an Atlas copy before configuring the actual Atlas.
workspace = "./work"
atlas = "./atlas"
backend = "responses" # responses or codex

[model]
# Pin both fields for reproducible research. Availability depends on the account.
model = "YOUR_AVAILABLE_MODEL_ID"
reasoning_effort = "max"
api_key_env = "OPENAI_API_KEY"
timeout = 600 # One Responses call; adjust for the account/model.
codex_timeout = 1800 # One native Codex agent session; distinct from a single API-call timeout.
max_output_tokens = 12000
web_search = true
# base_url = "https://api.openai.com/v1"
# command = "codex"

[budgets]
# Includes initial material, conversation history, tool definitions, and output schema, beyond paper text alone.
max_input_chars = 60000
max_tool_chars = 12000
max_turns = 50
max_segments = 4
max_protocol_repairs = 2
max_science_revisions = 1
max_total_calls = 160
max_external_calls = 80
max_candidates = 12
max_jobs = 80

[publication]
# Scan updates are ingested automatically after independent LLM review by default; use true for per-case human approval.
require_human_approval = false

# The initial task catalog is editable configuration, not an assertion about six existing user categories.
# User-configured approved=true authorizes scanning this scope; task_scout cannot expand the catalog itself.
[[tasks]]
task_id = "single_objective"
label = "Single-objective optimization"
queries = ["oracle complexity optimization", "zeroth order optimization complexity"]
approved = true

[[tasks]]
task_id = "minimax"
label = "Minimax and saddle points"
queries = ["oracle complexity minimax saddle point"]
approved = true

[[tasks]]
task_id = "variational_inequality"
label = "Variational inequalities"
queries = ["oracle complexity variational inequality"]
approved = true

[[tasks]]
task_id = "bilevel"
label = "Bilevel optimization"
queries = ["bilevel optimization oracle complexity"]
approved = true

[[tasks]]
task_id = "online_learning"
label = "Online optimization and interactive learning"
queries = ["online optimization oracle feedback regret complexity"]
approved = true

[[tasks]]
task_id = "matrix_computation"
label = "Oracle matrix computation"
queries = ["matrix vector queries oracle complexity matrix approximation"]
approved = true


# Bounded large-profile own-read headroom. New plans are required after budget changes.
# Paths resolve against this configuration file. Point atlas at a copy for first acceptance.
atlas = "../atlas-copy"
workspace = "../work"
backend = "codex" # codex or responses; each role uses an independent session
timezone = "UTC"

[model]
# Codex uses its configured model when model is omitted. Responses requires a model ID.
command = "codex"
codex_timeout = 1800
# model = "<an available model ID>"
api_key_env = "OPENAI_API_KEY"
timeout = 180
max_output_tokens = 16000
# The maintenance host owns bibliography and immutable source access.
web_search = false

[maintenance]
order = "current_catalog" # existing data/derived/catalog.json order, then source_order fallback
min_recheck_days = 14
overlap_days = 30

[execution]
# Independent settings; each worker owns its runner, SQLite connection and role hosts.
max_workers = 10

[budgets]
finite_research_scope = true
source_recovery = true
max_discovery_queries = 6 # Four initial directions plus two reserved refinements.
refinement_query_reserve = 2
max_provider_page_attempts = 24 # Network metadata pages and exact lookups; cache hits spend no network allowance.
max_pages_per_route = 4
max_metadata_records = 200
min_novelty_records = 25
light_min_novelty_records = 10
adaptive_input_budget = true
adaptive_tool_budget = true
reserve_control_calls = true
scout_tool_calls_cap = 128
reviewer_tool_calls_cap = 128
auto_tools_hard_cap = 128
# One baseline/cutoff cycle, shared across research, review, retries and continuation.
setting_max_seconds = 1800
setting_max_tool_calls = 256
setting_max_sessions = 4
min_stage_seconds = 10
compact_profile_chars = 10000
joint_template_chars = 6000 # complete draft or exact on-demand artifact pointer
joint_review_chars = 8000 # otherwise read prepared /joint_analysis
synthesis_catalog_chars = 6000 # candidates are not scientific approval
review_input_pack_chars = 10000
retained_adoption_catalog_chars = 8000
max_searches_per_setting = 6 # Legacy mode only; finite scope uses distinct-query/page counters.
max_sources_per_setting = 8
max_source_attempts_per_setting = 16
max_source_reads_per_setting = 32
max_tool_calls_per_stage = 64
max_tool_chars = 10000
max_model_calls_per_stage = 8 # Responses calls; native Codex internals are not observable
max_context_chars = 120000 # Responses transcript; native Codex bounded by timeout/tool budgets

[cache]
search_ttl_seconds = 21600
source_ttl_seconds = 21600

[literature]
timeout = 30
max_bytes = 20000000
max_source_file_bytes = 80000000
max_source_download_bytes = 160000000
max_source_download_attempts = 16
max_source_replacements = 2
arxiv_interval = 3
# contact = "your-public-contact@example.org"

[observability]
# Research closes before the hard cap; the remaining time is for an honest handoff.
close_reserve_seconds = 180
poll_seconds = 0.5
compact_handoff = true
